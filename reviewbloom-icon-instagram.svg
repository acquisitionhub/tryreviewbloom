<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700&amp;display=swap');
    </style>
    <linearGradient id="outerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3d27"/>
      <stop offset="100%" style="stop-color:#0a2b1c"/>
    </linearGradient>
    <linearGradient id="squareBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e8f52"/>
      <stop offset="100%" style="stop-color:#155f36"/>
    </linearGradient>
  </defs>

  <!-- Dark green outer background -->
  <rect width="800" height="800" fill="url(#outerBg)"/>

  <!-- Green rounded square (the nav icon box) -->
  <rect x="80" y="80" width="640" height="640" rx="130" ry="130" fill="url(#squareBg)"/>

  <!-- Subtle inner glow -->
  <rect x="80" y="80" width="640" height="640" rx="130" ry="130"
    fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- 🌿 Leaf emoji -->
  <text
    x="400" y="480"
    font-size="340"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🌿</text>
</svg>
